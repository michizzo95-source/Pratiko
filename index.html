<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratiko - Calcolo Stipendio Netto</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .result-box {
      margin-top: 24px;
      padding: 16px;
      background: #eff6ff;
      border-radius: 12px;
      display: none;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .result-item.total {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      border-top: 1px solid #bfdbfe;
      padding-top: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="brand">PRATIKO</div>
  <div class="tagline">Burocrazia Facile & Semplice</div>

  <div class="form-group">
    <label for="ral">Stipendio Lordo Annuale (RAL €)</label>
    <input type="number" id="ral" placeholder="Es. 25000">
  </div>

  <div class="form-group">
    <label for="mensilita">Numero di Mensilità</label>
    <select id="mensilita">
      <option value="13">13 Mensilità</option>
      <option value="14">14 Mensilità</option>
      <option value="12">12 Mensilità</option>
    </select>
  </div>

  <button onclick="calcolaNetto()">Calcola Stipendio Netto</button>

  <div class="result-box" id="result">
    <div class="result-item">
      <span>Trattenute INPS (9.19%):</span>
      <span id="inps">0 €</span>
    </div>
    <div class="result-item">
      <span>IRPEF Stimata:</span>
      <span id="irpef">0 €</span>
    </div>
    <div class="result-item total">
      <span>Netto Mensile:</span>
      <span id="netto">0 €</span>
    </div>
  </div>
</div>

<script>
function calcolaNetto() {
  const ral = parseFloat(document.getElementById('ral').value);
  const mensilita = parseInt(document.getElementById('mensilita').value);

  if (!ral || ral <= 0) {
    alert("Inserisci una RAL valida!");
    return;
  }

  // Calcolo Contributi INPS (circa 9.19%)
  const inpsAnnuo = ral * 0.0919;
  const imponibileIrpef = ral - inpsAnnuo;

  // Calcolo IRPEF a scaglioni
  let irpefAnnua = 0;
  if (imponibileIrpef <= 28000) {
    irpefAnnua = imponibileIrpef * 0.23;
  } else if (imponibileIrpef <= 50000) {
    irpefAnnua = (28000 * 0.23) + ((imponibileIrpef - 28000) * 0.35);
  } else {
    irpefAnnua = (28000 * 0.23) + (22000 * 0.35) + ((imponibileIrpef - 50000) * 0.43);
  }

  // Calcolo Netto Annuo e Mensile
  const nettoAnnuo = imponibileIrpef - irpefAnnua;
  const nettoMensile = nettoAnnuo / mensilita;

  // Output Dati
  document.getElementById('inps').innerText = Math.round(inpsAnnuo / mensilita) + ' €/mese';
  document.getElementById('irpef').innerText = Math.round(irpefAnnua / mensilita) + ' €/mese';
  document.getElementById('netto').innerText = Math.round(nettoMensile) + ' €';

  document.getElementById('result').style.display = 'block';
}
</script>

</body>
</html>
